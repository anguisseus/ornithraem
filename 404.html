<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>The Ornithraem - Redirecting...</title>
    <script type="text/javascript">
        var pathSegmentsToKeep = 0;
        var l = window.location;
        var repoPrefix = l.pathname.split('/')[1];
        var targetRoute = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        
        l.replace(
            l.protocol + '//' + l.host + '/' + (repoPrefix ? repoPrefix + '/' : '') +
            'index.html#' + targetRoute + l.search
        );
    </script>
</head>
<body>
</body>
</html>
