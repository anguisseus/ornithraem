media:
  input: assets
  output: /assets

content:
  - name: pages
    label: Pages
    type: group
    items:
      - name: ministories
        label: Mini Stories
        type: collection
        path: pages/the-blog/ministories
        format: json
        filename: "{primary}.json"
        view:
          primary: title
          fields: [title, date, author]
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: date
            label: Date
            type: string
          - name: content
            label: Story
            type: rich-text
            options:
              format: html
              media: false
          - name: author
            label: Author
            type: string
          - name: hero_image
            label: Hero Image Filename
            type: string
            required: false
            description: Filename inside /assets/ministories/, set to artwork.png for default

