
name: Generate story HTML

on:
  push:
    branches:
      - main
    paths:
      - "pages/the-blog/ministories/*.json"
      - "scripts/generate-pages.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate HTML partials and story index
        run: node scripts/generate-pages.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pages/the-blog/ministories/*.html
          git add pages/the-blog/ministories/ministories.json

          if git diff --cached --quiet; then
            echo "No generated files have changed."
          else
            git commit -m "Generate story pages and index from CMS content"
            git push
          fi
