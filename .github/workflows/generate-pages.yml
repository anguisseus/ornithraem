name: Generate story HTML and Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "pages/the-blog/ministories/*.json"
      - "!pages/the-blog/ministories/ministories.json"
      - "scripts/generate-pages.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate story pages, index, and hero CSS
        run: node scripts/generate-pages.mjs

      - name: Generate Sitemap XML
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const DOMAIN = "https://anguisseus.github.io/ornithraem";
          // Base static routes
          const routes = ["#home", "#the-blog", "#books", "#artwork", "#about", "#the-blog/ministories"];
          
          function scanDir(dir) {
              if (!fs.existsSync(dir)) return;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                  const fullPath = path.join(dir, entry.name);
                  if (entry.isDirectory()) {
                      scanDir(fullPath);
                  } else if (entry.isFile() && entry.name.endsWith(".html")) {
                      const nameWithoutExt = entry.name.replace(".html", "");
                      routes.push(`#the-blog/ministories/${nameWithoutExt}`);
                  }
              }
          }

          scanDir("pages/the-blog/ministories");

          let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
          xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;
          const today = new Date().toISOString().split("T")[0];

          for (const route of routes) {
              const cleanUrl = route.replace("#", "");
              xml += `  <url>\n    <loc>${DOMAIN}/#${cleanUrl}</loc>\n    <lastmod>${today}</lastmod>\n  </url>\n`;
          }
          xml += `</urlset>`;

          fs.writeFileSync("sitemap.xml", xml, "utf-8");
          console.log("Clean sitemap generated successfully.");
          '

      - name: Commit generated files and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pages/the-blog/ministories/*.html
          git add pages/the-blog/ministories/ministories.json
          git add static/ministories-heroes.css
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Generate pages and assets and update sitemap [skip ci]"
            git push
          fi
